<!--
  Custom unDraw-style SVG illustrations for the वॉलेट project.
  Flat geometric aesthetic, designed to feel cohesive yet zone-distinct.
  Each illustration has its own primary color matching its zone.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <!-- ============ HERO ILLUSTRATION: Secure Wallet ============ -->
    <symbol id="illus-hero" viewBox="0 0 400 320">
      <!-- Background blob -->
      <ellipse cx="200" cy="160" rx="180" ry="120" fill="#1a1f3a" opacity="0.5"/>
      <!-- Decorative grid dots -->
      <g fill="#3a3f5a" opacity="0.4">
        <circle cx="40"  cy="40"  r="2"/>
        <circle cx="80"  cy="40"  r="2"/>
        <circle cx="120" cy="40"  r="2"/>
        <circle cx="360" cy="40"  r="2"/>
        <circle cx="40"  cy="280" r="2"/>
        <circle cx="80"  cy="280" r="2"/>
        <circle cx="320" cy="280" r="2"/>
        <circle cx="360" cy="280" r="2"/>
      </g>
      <!-- Floating coin 1 -->
      <g transform="translate(60,90)">
        <circle cx="0" cy="0" r="22" fill="#8b5cf6" opacity="0.85"/>
        <circle cx="0" cy="0" r="18" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
        <text x="0" y="6" text-anchor="middle" fill="#fff" font-size="18" font-weight="700" font-family="Inter, sans-serif">₹</text>
      </g>
      <!-- Floating coin 2 -->
      <g transform="translate(330,80)">
        <circle cx="0" cy="0" r="16" fill="#6c8cff" opacity="0.8"/>
        <text x="0" y="5" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="Inter, sans-serif">₹</text>
      </g>
      <!-- Floating coin 3 -->
      <g transform="translate(340,250)">
        <circle cx="0" cy="0" r="14" fill="#a78bfa" opacity="0.7"/>
        <text x="0" y="4" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="Inter, sans-serif">₹</text>
      </g>
      <!-- Main wallet -->
      <g transform="translate(110,110)">
        <!-- shadow -->
        <rect x="6" y="10" width="180" height="110" rx="14" fill="#000" opacity="0.25"/>
        <!-- wallet body -->
        <rect x="0" y="0" width="180" height="110" rx="14" fill="#6c8cff"/>
        <!-- gradient highlight -->
        <rect x="0" y="0" width="180" height="55" rx="14" fill="#8b5cf6" opacity="0.6"/>
        <!-- strap -->
        <rect x="0" y="60" width="180" height="3" fill="#5a6dd9"/>
        <!-- card slot -->
        <rect x="20" y="25" width="100" height="22" rx="3" fill="#fff" opacity="0.9"/>
        <!-- lock badge -->
        <circle cx="148" cy="68" r="18" fill="#10b981"/>
        <path d="M141 68 v-6 a7 7 0 0 1 14 0 v6 h-3 v-6 a4 4 0 0 0 -8 0 v6 z M139 68 h18 v14 h-18 z" fill="#fff"/>
        <!-- card peek -->
        <rect x="130" y="35" width="40" height="20" rx="3" fill="#fbbf24"/>
        <rect x="135" y="42" width="14" height="6" rx="1" fill="#fff" opacity="0.6"/>
      </g>
      <!-- Arrow flow -->
      <g stroke="#8b5cf6" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
        <path d="M50 200 Q 100 220 130 200" stroke-dasharray="3,4"/>
      </g>
    </symbol>

    <!-- ============ EMPTY HISTORY: no transactions ============ -->
    <symbol id="illus-empty" viewBox="0 0 200 160">
      <ellipse cx="100" cy="140" rx="70" ry="6" fill="#1a1f3a"/>
      <!-- Empty list card -->
      <rect x="40" y="40" width="120" height="80" rx="8" fill="#1a1f3a" stroke="#2a3050" stroke-width="1.5"/>
      <line x1="55" y1="60" x2="120" y2="60" stroke="#3a3f5a" stroke-width="2" stroke-linecap="round"/>
      <line x1="55" y1="75" x2="100" y2="75" stroke="#3a3f5a" stroke-width="2" stroke-linecap="round"/>
      <line x1="55" y1="90" x2="110" y2="90" stroke="#3a3f5a" stroke-width="2" stroke-linecap="round"/>
      <!-- magnifying glass -->
      <circle cx="135" cy="100" r="14" fill="none" stroke="#06b6d4" stroke-width="3"/>
      <line x1="146" y1="111" x2="156" y2="121" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
    </symbol>

    <!-- ============ ZONE ILLUSTRATIONS ============ -->

    <!-- SEND: paper plane / arrow -->
    <symbol id="illus-send" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="55" fill="rgba(239,68,68,0.12)"/>
      <g transform="translate(30,30)">
        <path d="M5 30 L55 5 L45 55 L25 35 Z" fill="#ef4444"/>
        <path d="M25 35 L45 55 L30 40 Z" fill="#f97316"/>
        <path d="M5 30 L25 35 L20 25 Z" fill="#fbbf24"/>
      </g>
      <!-- motion lines -->
      <line x1="15" y1="50" x2="25" y2="55" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
      <line x1="10" y1="65" x2="22" y2="68" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      <line x1="15" y1="80" x2="25" y2="80" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    </symbol>

    <!-- RECEIVE: down arrow + box -->
    <symbol id="illus-receive" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="55" fill="rgba(16,185,129,0.12)"/>
      <!-- envelope/inbox -->
      <rect x="25" y="40" width="70" height="50" rx="6" fill="none" stroke="#10b981" stroke-width="3"/>
      <path d="M25 40 L60 70 L95 40" fill="none" stroke="#10b981" stroke-width="3" stroke-linejoin="round"/>
      <!-- coin dropping in -->
      <circle cx="60" cy="22" r="10" fill="#22d3ee"/>
      <text x="60" y="27" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="Inter, sans-serif">₹</text>
      <!-- motion lines -->
      <line x1="48" y1="32" x2="44" y2="36" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
      <line x1="72" y1="32" x2="76" y2="36" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- REWARD: gift / trophy -->
    <symbol id="illus-reward" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="55" fill="rgba(245,158,11,0.12)"/>
      <!-- gift box -->
      <rect x="30" y="55" width="60" height="40" rx="4" fill="#f59e0b"/>
      <rect x="28" y="50" width="64" height="12" rx="3" fill="#fbbf24"/>
      <!-- ribbon vertical -->
      <rect x="55" y="50" width="10" height="45" fill="#ef4444"/>
      <!-- ribbon horizontal -->
      <rect x="28" y="56" width="64" height="6" fill="#ef4444"/>
      <!-- bow -->
      <ellipse cx="50" cy="48" rx="8" ry="6" fill="#ef4444"/>
      <ellipse cx="70" cy="48" rx="8" ry="6" fill="#ef4444"/>
      <circle cx="60" cy="48" r="4" fill="#dc2626"/>
      <!-- sparkles -->
      <g fill="#fbbf24">
        <path d="M85 30 L87 35 L92 37 L87 39 L85 44 L83 39 L78 37 L83 35 Z"/>
        <path d="M30 25 L31 28 L34 29 L31 30 L30 33 L29 30 L26 29 L29 28 Z"/>
      </g>
    </symbol>

    <!-- HISTORY: clock + list -->
    <symbol id="illus-history" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="55" fill="rgba(6,182,212,0.12)"/>
      <!-- clock face -->
      <circle cx="60" cy="60" r="30" fill="none" stroke="#06b6d4" stroke-width="3"/>
      <line x1="60" y1="60" x2="60" y2="42" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
      <line x1="60" y1="60" x2="74" y2="60" stroke="#06b6d4" stroke-width="3" stroke-linecap="round"/>
      <circle cx="60" cy="60" r="3" fill="#06b6d4"/>
      <!-- ticks -->
      <line x1="60" y1="34" x2="60" y2="38" stroke="#06b6d4" stroke-width="2"/>
      <line x1="60" y1="82" x2="60" y2="86" stroke="#06b6d4" stroke-width="2"/>
      <line x1="34" y1="60" x2="38" y2="60" stroke="#06b6d4" stroke-width="2"/>
      <line x1="82" y1="60" x2="86" y2="60" stroke="#06b6d4" stroke-width="2"/>
      <!-- arrow loop -->
      <path d="M30 30 A 30 30 0 0 1 90 30" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3"/>
      <path d="M85 25 L90 30 L85 35" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- SECURITY: shield + check -->
    <symbol id="illus-security" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="55" fill="rgba(99,102,241,0.12)"/>
      <!-- shield -->
      <path d="M60 20 L90 32 L90 60 Q 90 85 60 100 Q 30 85 30 60 L 30 32 Z" fill="#6366f1"/>
      <path d="M60 20 L90 32 L90 60 Q 90 75 60 90 Q 30 75 30 60 L 30 32 Z" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <!-- check -->
      <path d="M45 60 L55 70 L75 50" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

  </defs>
</svg>
